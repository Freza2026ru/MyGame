<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Этот тег делает страницу адаптивной для смартфонов -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои Игры</title>
    <style>
        /* Базовые стили и темная тема */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            margin-bottom: 40px;
            font-size: 2.5rem;
            color: #4CAF50;
        }

        /* Контейнер для центрирования и адаптивности */
        .games-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Стили самой карточки с игрой */
        .game-card {
            display: block;
            width: 100%;
            max-width: 450px; /* Максимальная ширина картинки на ПК */
            background-color: #1e1e1e;
            border-radius: 15px;
            overflow: hidden;
            text-decoration: none;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            /* Плавная анимация при наведении */
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .game-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 25px rgba(0,0,0,0.6);
        }

        /* Стили для картинок, чтобы они не вылезали за края */
        .game-card img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Блок с названием под картинкой */
        .game-title {
            padding: 20px;
            font-size: 1.5rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Каталог моих игр</h1>

    <div class="games-container">
        <!-- Ссылка на папку GlugGlug -->
        <a href="GlugGlug/" class="game-card">
            <img src="Glug.png" alt="Игра Glug Glug">
            <div class="game-title">Glug Glug</div>
        </a>

        <!-- Ссылка на папку SpaceInvaders -->
        <a href="SpaceInvaders/" class="game-card">
            <img src="Inv.png" alt="Игра Void Siege">
            <div class="game-title">Void Siege (Space Invaders)</div>
        </a>
    </div>

</body>
</html>
