<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Этот тег делает страницу адаптивной для смартфонов -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игры полосатого кота</title>
    <meta name="description" content="Каталог браузерных игр: играй прямо в браузере на компьютере и телефоне">
    <meta property="og:title" content="Игры полосатого кота">
    <meta property="og:description" content="Каталог браузерных игр: играй прямо в браузере на компьютере и телефоне">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://freza2026ru.github.io/MyGame/preview.jpg">
    <meta property="og:url" content="https://freza2026ru.github.io/MyGame/">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://freza2026ru.github.io/MyGame/preview.jpg">
    <style>
        /* Базовые стили и темная тема */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        /* Шапка-баннер «Игры полосатого кота» */
        .banner {
            display: block;
            width: 100%;
            max-width: 1100px;
            height: auto;
            margin: 0 auto 40px;
            border-radius: 18px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.45);
        }

        /* Контейнер для центрирования и адаптивности */
        .games-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Стили самой карточки с игрой */
        .game-card {
            display: block;
            width: 100%;
            max-width: 370px; /* три карточки в ряд на ПК */
            background-color: #1e1e1e;
            border-radius: 15px;
            overflow: hidden;
            text-decoration: none;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            /* Плавная анимация при наведении */
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .game-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 25px rgba(0,0,0,0.6);
        }

        .game-card:focus-visible {
            outline: 3px solid #4CAF50;
            outline-offset: 4px;
        }

        /* Все превью одного размера (1200×630), даже если картинки чуть разные */
        .game-card img {
            width: 100%;
            aspect-ratio: 1200 / 630;
            object-fit: cover;
            display: block;
        }

        /* Блок с названием под картинкой */
        .game-title {
            padding: 20px 20px 6px;
            font-size: 1.5rem;
            font-weight: bold;
        }

        /* Короткое описание игры */
        .game-desc {
            padding: 0 20px 20px;
            font-size: 1rem;
            color: #b8b8b8;
            line-height: 1.4;
        }

        /* Значок «новинка» */
        .badge-new {
            display: inline-block;
            margin-left: 8px;
            padding: 2px 8px;
            font-size: 0.8rem;
            vertical-align: middle;
            color: #121212;
            background: #f2b84b;
            border-radius: 6px;
        }

        @media (prefers-reduced-motion: reduce) {
            .game-card { transition: none; }
            .game-card:hover { transform: none; }
        }
    </style>
</head>
<body>

    <img class="banner" src="preview.jpg" alt="Игры полосатого кота">

    <div class="games-container">
        <!-- Ссылка на папку workrun -->
        <a href="workrun/" class="game-card">
            <img src="Workrun.jpg" alt="Игра «Успеть на маршрутку»">
            <div class="game-title">Успеть на маршрутку <span class="badge-new">НОВАЯ</span></div>
            <div class="game-desc">Помоги Наташе догнать маршрутку №62 и успеть на любимую работу!</div>
        </a>

        <!-- Ссылка на папку GlugGlug -->
        <a href="GlugGlug/" class="game-card">
            <img src="Glug.jpg" alt="Игра Glug Glug">
            <div class="game-title">Glug Glug</div>
        </a>

        <!-- Ссылка на папку SpaceInvaders -->
        <a href="SpaceInvaders/" class="game-card">
            <img src="Inv.jpg" alt="Игра Void Siege">
            <div class="game-title">Void Siege (Space Invaders)</div>
        </a>
    </div>

</body>
</html>
